# Upstream for thearq.ai -> 127.0.0.1:3003
#
# Goes in the cPanel per-domain include dir, which survives EA-Nginx
# rebuilds:
#   /etc/nginx/conf.d/users/arqadmin/thearq.ai/nextjs-upstream.conf
#
# This one line decides what the public site is. cPanel's generated block
# for thearq.ai does `proxy_pass $CPANEL_APACHE_PROXY_PASS` in `location /`
# and in a handful of exact-match locations. Redefining that variable here
# means nginx goes straight to the Next app and Apache is never in the path
# at all - which is worth stating plainly, because the box also carries a
# complete and correct Apache proxy config for this domain
# (/etc/apache2/conf.d/userdata/{std,ssl}/2_4/arqadmin/thearq.ai/
# proxy-to-next.conf, both pointing at 3003) that is dead weight. Editing
# it, rebuilding httpd, restarting Apache: none of it moves the site.
#
# It was set to 3001 for months. 3001 is the preview app, so thearq.ai was
# serving preview's build while thearq-live.service on 3003 sat correctly
# deployed and unreachable. See README.md, "A deploy succeeds and the site
# does not change".

set $CPANEL_APACHE_PROXY_PASS http://127.0.0.1:3003;

# Next sets its own cache-control per route (s-maxage=300 on ISR pages,
# s-maxage=31536000 on fully static ones). Letting nginx keep a second copy
# on top of that means a deploy can land and the old bytes keep serving with
# no way to tell from the outside which layer is stale.
set $CPANEL_SKIP_PROXY_CACHING 1;
