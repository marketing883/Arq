# Narrow arqai-preview.service to loopback.
#
# Install as a drop-in, which does not require rewriting the unit:
#   /etc/systemd/system/arqai-preview.service.d/10-loopback.conf
#   systemctl daemon-reload && systemctl restart arqai-preview.service
#
# Verify afterwards. The bind is the whole point of the change, so check it
# rather than assuming:
#   ss -lntp | grep 3001      # want 127.0.0.1:3001, not *:3001
#
# Why a drop-in and not an edit: the unit on the box is not in this repo,
# so replacing it wholesale would mean reproducing it from memory. A
# drop-in overrides one directive and leaves everything else - User,
# EnvironmentFile, Restart - exactly as it is.
#
# The unit as it stands, read off the box before this was applied. Recorded
# because the ExecStart below only makes sense against the one it replaces,
# and because nothing else in this repo says what runs preview:
#
#   [Service]
#   Type=simple
#   WorkingDirectory=/opt/arqapi/arqai-website
#   Environment=NODE_ENV=production
#   Environment=PORT=3001
#   ExecStart=/usr/bin/npm start
#   Restart=always
#   RestartSec=3
#   EnvironmentFile=/opt/arqapi/arqai-website/.env.local
#   User=arqadmin
#   Group=arqadmin
#   Environment=HOSTNAME=127.0.0.1
#
# `Environment=HOSTNAME=127.0.0.1` in that unit is the failed attempt this
# file exists to replace. It is left in place: it is inert, and clearing an
# inherited Environment= through a drop-in is awkward enough not to be
# worth bundling into the same change.
#
# Applied and verified 2026-08-27: `ss -lntp` went from *:3001 to
# 127.0.0.1:3001, with preview.thearq.ai, labs.thearq.ai and thearq.ai all
# still answering 200.
#
# Why the empty ExecStart= first: systemd treats ExecStart as a list and
# appends by default, which for Type=simple is a hard error rather than a
# replacement. The empty assignment clears the inherited value so the line
# below replaces it.
#
# Why the flag and not the variable: `Environment=HOSTNAME=127.0.0.1` was
# tried on this unit and `ss` still reported *:3001. HOSTNAME is read by
# the server that `output: 'standalone'` generates; this app runs a bare
# `next start`, which takes -H/--hostname and otherwise defaults to
# 0.0.0.0 whatever the variable says. Do not put the flag in package.json
# either - thearq.ai builds from this same repo and would inherit it.
#
# Safe for what currently uses this app: preview.thearq.ai and
# labs.thearq.ai both reach it through nginx over loopback, which is
# unaffected. What this cuts off is direct access to <public-ip>:3001 from
# the internet, which is the reason for the change. Note that thearq.ai
# also pointed here until the upstream was corrected to 3003 - confirm
# nginx-live-upstream.conf is in place before restarting, or production
# goes with it.

[Service]
ExecStart=
ExecStart=/usr/bin/npm start -- -H 127.0.0.1 -p 3001
