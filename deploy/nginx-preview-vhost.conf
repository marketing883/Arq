# HTTPS server block for preview.thearq.ai.
#
# Install as a standalone file:
#   /etc/nginx/conf.d/preview.thearq.ai.conf
#
# Why this file exists: preview.thearq.ai had no `listen 443` block at all.
# cPanel's generated /etc/nginx/conf.d/users/arqadmin.conf declares the site
# on port 80 only, so every HTTPS connection fell through to a default
# server that rejects the handshake - which is the connection reset that
# made the site look dead for hours while the app underneath was perfectly
# healthy on 127.0.0.1:3001. The certificate was already issued and sitting
# unused in /etc/letsencrypt/live/preview.thearq.ai/.
#
# Standalone rather than an edit to arqadmin.conf, because that file is
# generated by EA-Nginx and a hand edit there is silently discarded on the
# next rebuild. labs.thearq.ai on this box is configured the same way and
# is the model for this file.
#
# Deliberately NO `listen 80` block here. cPanel already declares one for
# this server_name, and a second would collide - nginx warns about the
# conflicting server name and serves whichever it loaded first, which is a
# coin toss nobody should be relying on. That does mean HTTP is not
# redirected to HTTPS; see the note at the bottom.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name preview.thearq.ai;

    ssl_certificate     /etc/letsencrypt/live/preview.thearq.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.thearq.ai/privkey.pem;

    # Deploy hook. Declared here rather than pulled in from the cPanel
    # per-domain include directory, because that directory also holds
    # cPanel's own `set $CPANEL_APACHE_PROXY_PASS ...` fragments, which
    # belong to its generated blocks and not to this one.
    location = /__deploy {
        # HTTPS only. Belt and braces: this block only listens on 443, but
        # the guard travels with the location so it stays correct if the
        # block is ever copied somewhere that also serves port 80.
        if ($scheme != "https") { return 400; }

        # A build takes minutes; nginx must not time out and report a
        # failure while the deploy is still running.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;

        proxy_pass http://127.0.0.1:9096/deploy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The hook authenticates the bearer token itself; this only keeps
        # the obvious noise out of the log and off the Python process.
        limit_except POST { deny all; }
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Two things left deliberately undone, both needing a decision rather than
# a guess:
#
# 1. HTTP is still served, unredirected, by cPanel's port-80 block. Every
#    site on this box behaves that way today, so preview is not an
#    exception - but a plaintext copy of a site that also serves HTTPS is
#    worth closing across the board, not one host at a time. The deploy
#    endpoint is already protected: its guard returns 400 on port 80.
#
# 2. www.preview.thearq.ai is not listed. cPanel's block claims that name,
#    and the certificate may not cover it; adding it here would serve a
#    mismatched certificate rather than fix anything. Check what
#    /etc/letsencrypt/live/preview.thearq.ai/ actually covers before adding
#    it:
#      openssl x509 -in /etc/letsencrypt/live/preview.thearq.ai/fullchain.pem \
#        -noout -ext subjectAltName
